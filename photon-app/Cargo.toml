[package]
name = "photon-app"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_config.workspace = true
leptos_dom.workspace = true
leptos_integration_utils.workspace = true
leptos_macro.workspace = true
leptos_server.workspace = true
leptos_axum = { workspace = true, optional = true }

icondata.workspace = true
icondata_core.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
turf.workspace = true

orbital = { workspace = true, default-features = false }
uf-integrations = { workspace = true, default-features = false }
orbital-macros = { workspace = true }
uf-product-macros = { workspace = true }
uf-ssr = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
uf-app-registry = { workspace = true, optional = true }

photon = { workspace = true, optional = true }
photon-valence-admin = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
valence = { workspace = true, optional = true }
higgs = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "uf-integrations/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "orbital/ssr",
    "uf-integrations/ssr",
    "dep:photon",
    "photon/runtime",
    "photon/mem",
    "dep:photon-valence-admin",
    "dep:chrono",
    "dep:valence",
    "valence/surreal",
    "dep:higgs",
    "higgs/ssr",
    "dep:uf-ssr",
    "uf-ssr/ssr",
    "dep:inventory",
    "dep:uf-app-registry",
]
