[package]
name = "protected-photon-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Minimal protected /photon host proving auth gate + dashboard API"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
http-body-util = "0.1"
photon-backend = { path = "../../photon-backend" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
