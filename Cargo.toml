[workspace]
resolver = "2"
members = [
    "photon-app",
    "uf-ssr",
    "uf-app-registry",
    "uf-integrations",
    "uf-product-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
# Sibling crates and cfg-gated modules are often referenced from facade docs without
# being in the same rustdoc unit when building with --no-deps.
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
doc_markdown = "allow"
use_self = "allow"
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
match_wildcard_for_single_variants = "allow"
items_after_statements = "allow"
redundant_clone = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
implicit_clone = "allow"
trait_duplication_in_bounds = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
unnecessary_trailing_comma = "allow"
elidable_lifetime_names = "allow"
trivially_copy_pass_by_ref = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
ref_option = "allow"
manual_let_else = "allow"
cognitive_complexity = "allow"
match_same_arms = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
unnested_or_patterns = "allow"
too_long_first_doc_paragraph = "allow"
assigning_clones = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
collection_is_never_read = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
fn_params_excessive_bools = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

photon = { package = "uf-photon", version = "0.1.1", default-features = false }
photon-valence-admin = { path = "../photon-valence-admin" }
valence = { package = "uf-valence", version = "0.1.1", default-features = false, features = ["mem", "surreal"] }
higgs = { path = "../fleet/repos/valence-platform/higgs", default-features = false }
uf-host = { path = "../fleet/repos/valence-platform/uf-host", default-features = false }
uf-identity = { path = "../fleet/repos/valence-platform/uf-identity" }

orbital = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38", default-features = false }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", rev = "2815678421984f854e2690c6e13d45bc6512ae38" }

uf-integrations = { path = "uf-integrations", default-features = false }
uf-product-macros = { path = "uf-product-macros" }
uf-ssr = { path = "uf-ssr", default-features = false }
uf-app-registry = { path = "uf-app-registry" }
inventory = "0.3"

