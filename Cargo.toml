[workspace]
resolver = "2"
members = [
    "photon-app",
    "photon-backend",
    "examples/protected-photon-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean O'Rourke"]
repository = "https://github.com/unified-field-dev/photon-uf-app"
homepage = "https://github.com/unified-field-dev/photon-uf-app"
documentation = "https://github.com/unified-field-dev/photon-uf-app"

[workspace.lints.rust]
missing_docs = "deny"
# leptos-lints (Dylint) names are unknown to rustc/clippy alone
unknown_lints = "allow"
leptos_print_stdout = "deny"
leptos_event_target = "deny"
leptos_event_target_value = "deny"
leptos_unscoped_spawn = "deny"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

[workspace.lints.rustdoc]
# Sibling crates and cfg-gated modules are often referenced from public crate docs without
# being in the same rustdoc unit when building with --no-deps.
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

photon = { package = "uf-photon", path = "../../L0-upstream-cores/photon/photon", default-features = false }
valence = { package = "uf-valence", version = "0.1.5", default-features = false, features = ["mem", "sqlite"] }
higgs = { path = "../../L1-host-stack-kits/higgs/higgs", default-features = false }
higgs-host = { path = "../../L1-host-stack-kits/higgs/higgs-host", default-features = false }
higgs-identity = { path = "../../L1-host-stack-kits/higgs/higgs-identity" }
gauge = { path = "../../L2-product-platform/gauge/gauge", default-features = false }

orbital = { package = "orbital-ui", version = "0.1.3", default-features = false }
orbital-macros = { version = "0.1.4" }

uf-integrations = { path = "../../L2-product-platform/unified-field-product/uf-integrations", default-features = false }
uf-product-macros = { path = "../../L2-product-platform/unified-field-product/uf-product-macros" }
uf-product = { path = "../../L2-product-platform/unified-field-product/uf-product", default-features = false }
lepton-shell = { path = "../../L2-product-platform/lepton-uf-app/lepton-shell", default-features = false }
inventory = "0.3"
wasm-bindgen = "=0.2.126"

[patch."https://github.com/deathbreakfast/higgs"]
higgs = { path = "../../L1-host-stack-kits/higgs/higgs" }
higgs-host = { path = "../../L1-host-stack-kits/higgs/higgs-host" }
higgs-identity = { path = "../../L1-host-stack-kits/higgs/higgs-identity" }

[patch."https://github.com/deathbreakfast/lepton-auth"]
lepton-shell = { path = "../../L2-product-platform/lepton-uf-app/lepton-shell" }
lepton-auth = { path = "../../L1-host-stack-kits/lepton/lepton-auth" }
lepton-identity = { path = "../../L1-host-stack-kits/lepton/lepton-identity" }
lepton-host-adapter = { path = "../../L1-host-stack-kits/lepton/lepton-host-adapter" }
lepton = { path = "../../L1-host-stack-kits/lepton/lepton" }

[patch."https://github.com/deathbreakfast/unified-field-product"]
uf-product = { path = "../../L2-product-platform/unified-field-product/uf-product" }
uf-integrations = { path = "../../L2-product-platform/unified-field-product/uf-integrations" }
uf-product-macros = { path = "../../L2-product-platform/unified-field-product/uf-product-macros" }
uf-search-core = { path = "../../L2-product-platform/unified-field-product/uf-search-core" }

[patch."https://github.com/deathbreakfast/uf-notifications"]
uf-notifications-core = { path = "../../L2-product-platform/uf-notifications/uf-notifications-core" }
uf-notifications-api = { path = "../../L2-product-platform/uf-notifications/uf-notifications-api" }

# Kits may still git-pin older Valence; force one crates.io graph.
[patch."https://github.com/unified-field-dev/valence"]
uf-valence = { version = "0.1.5" }
uf-valence-core = { version = "0.1.5" }
uf-valence-codegen = { version = "0.1.5" }
uf-valence-macros = { version = "0.1.5" }
uf-valence-telemetry = { version = "0.1.5" }
uf-valence-backend-mem = { version = "0.1.5" }
uf-valence-backend-sqlite = { version = "0.1.5" }
uf-valence-backend-sql = { version = "0.1.5" }
uf-valence-schema-dsl = { version = "0.1.5" }

# Unify git Chronon pulls (gauge ssr) onto monorepo path crates.
[patch."https://github.com/unified-field-dev/chronon-coordinator"]
chronon-coordinator = { path = "../../L1-host-stack-kits/chronon-coordinator" }

[patch."https://github.com/unified-field-dev/chronon"]
chronon-core = { path = "../../L0-upstream-cores/chronon/chronon-core" }
chronon-executor = { path = "../../L0-upstream-cores/chronon/chronon-executor" }
chronon-scheduler = { path = "../../L0-upstream-cores/chronon/chronon-scheduler" }
chronon-telemetry = { path = "../../L0-upstream-cores/chronon/chronon-telemetry" }
uf-chronon = { path = "../../L0-upstream-cores/chronon/chronon" }

[patch."https://github.com/deathbreakfast/chronon"]
chronon-core = { path = "../../L0-upstream-cores/chronon/chronon-core" }
chronon-executor = { path = "../../L0-upstream-cores/chronon/chronon-executor" }
chronon-scheduler = { path = "../../L0-upstream-cores/chronon/chronon-scheduler" }
chronon-telemetry = { path = "../../L0-upstream-cores/chronon/chronon-telemetry" }
uf-chronon = { path = "../../L0-upstream-cores/chronon/chronon" }

# Operator: override crates.io Orbital with local L0 checkout
[patch.crates-io]
orbital-ui = { path = "../../L0-upstream-cores/orbital/orbital" }
orbital-macros = { path = "../../L0-upstream-cores/orbital/orbital-macros" }
orbital-shell = { path = "../../L0-upstream-cores/orbital/orbital-shell" }
orbital-core-components = { path = "../../L0-upstream-cores/orbital/orbital-core-components" }
orbital-base-components = { path = "../../L0-upstream-cores/orbital/orbital-base-components" }
orbital-primitives = { path = "../../L0-upstream-cores/orbital/orbital-primitives" }
orbital-theme = { path = "../../L0-upstream-cores/orbital/orbital-theme" }
orbital-paging = { path = "../../L0-upstream-cores/orbital/orbital-paging" }
orbital-datatable = { path = "../../L0-upstream-cores/orbital/orbital-datatable" }
orbital-date-pickers = { path = "../../L0-upstream-cores/orbital/orbital-date-pickers" }
orbital-charts = { path = "../../L0-upstream-cores/orbital/orbital-charts" }
orbital-tree = { path = "../../L0-upstream-cores/orbital/orbital-tree" }
orbital-scheduler = { path = "../../L0-upstream-cores/orbital/orbital-scheduler" }
orbital-motion = { path = "../../L0-upstream-cores/orbital/orbital-motion" }
orbital-style = { path = "../../L0-upstream-cores/orbital/orbital-style" }
orbital-data = { path = "../../L0-upstream-cores/orbital/orbital-data" }
