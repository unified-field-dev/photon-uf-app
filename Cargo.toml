[workspace]
resolver = "2"
members = [
    "photon-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
# Sibling crates and cfg-gated modules are often referenced from facade docs without
# being in the same rustdoc unit when building with --no-deps.
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

photon = { package = "uf-photon", version = "0.1.1", default-features = false }
photon-valence-admin = { git = "https://github.com/deathbreakfast/photon-valence-admin", branch = "main" }
valence = { package = "uf-valence", version = "0.1.1", default-features = false, features = ["mem", "sqlite"] }
higgs = { path = "../../L1-host-stack-kits/higgs/higgs", default-features = false }
uf-host = { path = "../../L1-host-stack-kits/higgs/uf-host", default-features = false }
uf-identity = { path = "../../L1-host-stack-kits/higgs/uf-identity" }

orbital = { package = "orbital-ui", git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }

uf-integrations = { path = "../../L3-products-zones-hosts/unified-field-product/uf-integrations", default-features = false }
uf-product-macros = { path = "../../L3-products-zones-hosts/unified-field-product/uf-product-macros" }
uf-product = { path = "../../L3-products-zones-hosts/unified-field-product/uf-product", default-features = false }
uf-ssr = { path = "../../L3-products-zones-hosts/counter-app/uf-ssr", default-features = false }
uf-app-registry = { path = "../../L3-products-zones-hosts/counter-app/uf-app-registry" }
lepton-shell = { path = "../../L1-host-stack-kits/lepton-auth/lepton-shell", default-features = false }
inventory = "0.3"
wasm-bindgen = "=0.2.126"

[patch."https://github.com/deathbreakfast/higgs"]
higgs = { path = "../../L1-host-stack-kits/higgs/higgs" }
uf-host = { path = "../../L1-host-stack-kits/higgs/uf-host" }
uf-identity = { path = "../../L1-host-stack-kits/higgs/uf-identity" }

[patch."https://github.com/deathbreakfast/lepton-auth"]
lepton-shell = { path = "../../L1-host-stack-kits/lepton-auth/lepton-shell" }
lepton-auth = { path = "../../L1-host-stack-kits/lepton-auth/lepton-auth" }
lepton-identity = { path = "../../L1-host-stack-kits/lepton-auth/lepton-identity" }
lepton-host-adapter = { path = "../../L1-host-stack-kits/lepton-auth/lepton-host-adapter" }
lepton = { path = "../../L1-host-stack-kits/lepton-auth/lepton" }

[patch."https://github.com/deathbreakfast/unified-field-product"]
uf-product = { path = "../../L3-products-zones-hosts/unified-field-product/uf-product" }
uf-integrations = { path = "../../L3-products-zones-hosts/unified-field-product/uf-integrations" }
uf-product-macros = { path = "../../L3-products-zones-hosts/unified-field-product/uf-product-macros" }
uf-notifications-core = { path = "../../L3-products-zones-hosts/unified-field-product/uf-notifications-core" }
uf-notifications-api = { path = "../../L3-products-zones-hosts/unified-field-product/uf-notifications-api" }
uf-search-core = { path = "../../L3-products-zones-hosts/unified-field-product/uf-search-core" }

[patch.crates-io]
uf-valence = { path = "../../L0-upstream-cores/valence/valence" }
uf-valence-core = { path = "../../L0-upstream-cores/valence/valence-core" }
uf-valence-codegen = { path = "../../L0-upstream-cores/valence/valence-codegen" }
uf-valence-macros = { path = "../../L0-upstream-cores/valence/valence-macros" }
uf-valence-telemetry = { path = "../../L0-upstream-cores/valence/valence-telemetry" }
