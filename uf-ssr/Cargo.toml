[package]
name = "uf-ssr"
version = "0.1.0"
edition = "2021"
description = "SSR Valence context helpers for standalone uf-app workspaces (Higgs-backed)"
license = "MIT"

[lints]
workspace = true

[dependencies]
higgs = { workspace = true }
leptos = { workspace = true, default-features = false }
higgs-host = { workspace = true, default-features = false }
valence = { workspace = true, default-features = false }

[features]
default = []
ssr = ["higgs/ssr", "higgs-host/ssr", "leptos/ssr"]
